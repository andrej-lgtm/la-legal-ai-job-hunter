steps:
  # Build Docker container image on Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/la-legal-job-hunter', '.']

  # Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/la-legal-job-hunter']

  # Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'la-legal-job-hunter'
      - '--image'
      - 'gcr.io/$PROJECT_ID/la-legal-job-hunter'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'DASHBOARD_PASSCODE=90038'

images:
  - 'gcr.io/$PROJECT_ID/la-legal-job-hunter'
