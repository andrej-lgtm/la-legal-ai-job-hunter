name: Daily Legal & AI Job Scraper

on:
  schedule:
    # Runs twice daily at 8:00 AM PST (15:00 UTC) and 5:00 PM PST (00:00 UTC)
    - cron: '0 15,0 * * *'
  workflow_dispatch:

jobs:
  scrape-and-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper & Evaluation Pipeline
        run: |
          python main.py --daily

      - name: Upload Daily HTML Digest
        uses: actions/upload-artifact@v4
        with:
          name: daily-legal-digest
          path: data/digests/*.html
          retention-days: 14
