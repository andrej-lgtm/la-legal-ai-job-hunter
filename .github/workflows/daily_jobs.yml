name: Daily Legal & AI Job Hunter

on:
  schedule:
    # Runs at 15:00 UTC (8:00 AM PST) every day
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Hunter Pipeline
        env:
          CONFIG_PATH: config.yaml
        run: |
          python main.py --run-now

      - name: Commit and push updated database & digests
        run: |
          git config --global user.name 'JobHunter Bot'
          git config --global user.email 'bot@noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update daily job intelligence [skip ci]"
          git push
